name: Build and Release APK

on:
  push:
    branches: [ "main", "fase-*" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "App version is $VERSION"

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/AuroPlayer-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/AuroPlayer-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroPlayer-v${{ env.APP_VERSION }}
          path: release-apk/AuroPlayer-v${{ env.APP_VERSION }}.apk
          retention-days: 30

      - name: Create or Update Version Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/fase-')
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Aurō Player v${{ env.APP_VERSION }}"
          body: |
            ### 🎵 Aurō Player v${{ env.APP_VERSION }}

            Build compilado automaticamente pelo GitHub Actions.

            - **Versão:** `v${{ env.APP_VERSION }}`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            #### 📲 Como Instalar:
            1. Baixe o arquivo `AuroPlayer-v${{ env.APP_VERSION }}.apk` abaixo.
            2. Abra no Android e confirme a instalação.
          prerelease: false
          draft: false
          files: |
            release-apk/AuroPlayer-v${{ env.APP_VERSION }}.apk
            release-apk/AuroPlayer-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release Pointer
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fase-')
        with:
          tag_name: latest
          name: "Aurō Player - Latest Build (v${{ env.APP_VERSION }})"
          body: |
            ### 🎵 Aurō Player - Última Versão Compilada (v${{ env.APP_VERSION }})

            APK gerado automaticamente pelo GitHub Actions a partir da branch `main`.

            - **Versão Atual:** `v${{ env.APP_VERSION }}`
            - **Arquivo Versionado:** `AuroPlayer-v${{ env.APP_VERSION }}.apk`
            - **Arquivo Latest:** `AuroPlayer-latest.apk`
            - **Commit:** `${{ github.sha }}`
          prerelease: false
          draft: false
          files: |
            release-apk/AuroPlayer-v${{ env.APP_VERSION }}.apk
            release-apk/AuroPlayer-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
