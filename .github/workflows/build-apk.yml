name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/AuroPlayer-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroPlayer-Debug
          path: release-apk/AuroPlayer-Debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Aurō Player - Latest Build"
          body: |
            ### 🎵 Aurō Player - Última Versão Compilada

            APK gerado automaticamente pelo GitHub Actions.

            - **Arquivo:** `AuroPlayer-Debug.apk`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            #### 📲 Como Instalar:
            1. Baixe o arquivo `AuroPlayer-Debug.apk` abaixo.
            2. No dispositivo Android, abra o arquivo e confirme a instalação (conceda permissão para instalar fontes desconhecidas se solicitado).
          prerelease: false
          draft: false
          files: |
            release-apk/AuroPlayer-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
